name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

env:
  CFLAGS: -Wno-error=incompatible-pointer-types

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image tagged with the git SHA
        working-directory: starter/backend
        run: |
          docker build --tag ${{ steps.ecr.outputs.registry }}/backend:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/backend:${{ github.sha }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name cluster --region ${{ vars.AWS_REGION }}
      - name: Apply the Kubernetes manifests
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=${{ steps.ecr.outputs.registry }}/backend:${{ github.sha }}
          kustomize build | kubectl apply -f -
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl get deployments
          kubectl get pods -o wide
      - name: Show backend service address
        run: |
          sleep 30
          kubectl get svc backend
          echo "Backend URL: http://$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')/movies"
